<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>GGE Tracker - ReBorN vs MADDEVILS</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; }
        .alliance-card { background: #1f1f1f; border: 1px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        h2 { color: #f39c12; margin-top: 0; }
        pre { background: #000; padding: 10px; border-radius: 4px; overflow-x: auto; color: #00ff00; }
    </style>
</head>
<body>
    <h1>Tracker Sojuszy (E4K Polska 1)</h1>
    <div id="update-time" style="color: #888; margin-bottom: 20px;">Ładowanie danych...</div>
    
    <div id="alliances-container">
        <!-- Tutaj pojawią się karty sojuszy -->
    </div>

    <script>
        // Zapobiegamy cache'owaniu pliku dodając timestamp
        const cacheBuster = new Date().getTime();
        
        fetch(`data/stats.json?t=${cacheBuster}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Brak pliku JSON lub błąd serwera');
                }
                return response.json();
            })
            .then(data => {
                // Błąd nawiasu został tutaj naprawiony
                document.getElementById('update-time').innerText = "Ostatnia aktualizacja: " + (data.updated_at || "Brak danych");
                const container = document.getElementById('alliances-container');
                container.innerHTML = '';
                
                data.alliances.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'alliance-card';
                    card.innerHTML = `
                        <h2>${item.name} [${item.tag}] (AID: ${item.aid})</h2>
                        <pre>${JSON.stringify(item.stats, null, 2)}</pre>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Błąd ładowania danych:', error);
                document.getElementById('update-time').innerText = "Błąd pobierania danych. Sprawdź, czy akcja na GitHubie wygenerowała plik stats.json.";
            });
    </script>
</body>
</html>
